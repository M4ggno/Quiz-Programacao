<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
</head>

<body>

    <header>
        <nav>
            <h2>Quiz de Programação</h2>
            <div class="menu">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="cadastro.html">Cadastro</a>
            </div>
        </nav>
    </header>

    <main>

        <section class="container">

            <h2>Cadastro</h2>

            <form action="inicio.html">

                <label>Nome:</label>
                <input type="text" required placeholder="Digite seu nome completo">

                <label>Email:</label>
                <input type="email" required placeholder="Digite seu email">

                <label>Senha:</label>
                <input type="password" required placeholder="Digite sua senha"  pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="A senha deve conter pelo menos 8 caracteres, incluindo letras maiúsculas, minúsculas e números.">

                <button type="submit">Cadastrar</button>

            </form>

        </section>

    </main>

    <footer>
        <p>© 2026 Quiz de Programação</p>
    </footer>

</body>

</html>
